[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "networkx-backbone"
dynamic = ["version"]
description = "Backbone extraction algorithms for complex networks"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    {name = "Brian C. Keegan", email = "brian.keegan@colorado.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "networkx>=3.4",
]

[project.optional-dependencies]
full = [
    "numpy>=2.2",
    "scipy>=1.15",
]
viz = [
    "matplotlib>=3.10",
]
# Hypergraph libraries for the hypergraph_io adapters.  Floors are the oldest
# releases that pass tests/test_hypergraph_interop.py (see docs/install.rst).
xgi = [
    "xgi>=0.9.1",
]
hypernetx = [
    "hypernetx>=2.3.10",
]
hypergraphx = [
    "hypergraphx>=1.7.7",
]
hat = [
    "numpy>=2.2",
    "HypergraphAnalysisToolbox>=1.1.18",
]
interop = [
    "networkx-backbone[xgi,hypernetx,hypergraphx,hat]",
]
test = [
    "pytest>=7.0",
    "numpy>=2.2",
    "scipy>=1.15",
    "pandas>=2.3",
]
# Static type checking (`mypy networkx_backbone`, configured in [tool.mypy]).
# Pinned so a new mypy or stubs release cannot break CI unannounced; bump both
# deliberately.  types-networkx provides the NetworkX stubs (NetworkX ships no
# inline types).
typing = [
    "mypy==2.4.0",
    "types-networkx==3.6.1.20261018",
]
dev = [
    "networkx-backbone[full,test,viz,typing]",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]
benchmark = [
    "asv>=0.6",
    "virtualenv",
]
docs = [
    "sphinx>=7.0",
    "sphinx-gallery>=0.18",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.6",
    "sphinx-copybutton>=0.5",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/brianckeegan/networkx_backbone"
Documentation = "https://brianckeegan.github.io/networkx_backbone/"
Repository = "https://github.com/brianckeegan/networkx_backbone"
Issues = "https://github.com/brianckeegan/networkx_backbone/issues"

[tool.setuptools.packages.find]
include = ["networkx_backbone*"]

[tool.setuptools.package-data]
# PEP 561 marker: the package ships inline type annotations.
networkx_backbone = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run docstring examples too: `pytest --doctest-modules networkx_backbone tests`.
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "interop: round trips against the real xgi/HyperNetX/HypergraphX/HAT (pip install -e '.[interop]'; select with -m interop)",
]
filterwarnings = [
    # Methods warn when a filter keeps every edge; tests check for it explicitly.
    "ignore:.*filtered graph has the same number of edges:UserWarning",
]

[tool.coverage.run]
source = ["networkx_backbone"]

[tool.mypy]
# Non-strict to start (#18): mypy checks the bodies of annotated functions
# (the public API) and leaves unannotated private helpers alone.  NetworkX
# ships no inline types; the CI job installs the typeshed stubs
# (types-networkx, pinned in the typing extra) instead of setting
# ignore_missing_imports for networkx, which would make nx.Graph Any (so the
# graph annotations would check nothing) and hide whether NetworkX's
# decorators keep our signatures (see networkx_backbone/_typing.py).
python_version = "3.12"
files = ["networkx_backbone"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional dependencies without inline types (scipy-stubs and pandas-stubs
# exist but are not required yet).
module = ["scipy", "scipy.*", "pandas"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Mirrors the rule families NetworkX and the wider scientific-Python stack use.
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = [
    "E501",    # long lines in docstrings/references are fine; the formatter wraps code
    "RUF001",  # Greek letters and math symbols in strings are intentional
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ is grouped by topic, not sorted
    "B905",    # zip(strict=...) is not required for same-length internal arrays
]

[tool.ruff.lint.per-file-ignores]
"networkx_backbone/__init__.py" = ["F401", "F403", "F405"]
"tests/*" = ["B018", "E741", "RUF012"]
# asv reads params/param_names/timeout as plain class attributes.
"benchmarks/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["networkx_backbone"]

[tool.numpydoc_validation]
# Docstring checks shared by `python -m numpydoc lint networkx_backbone/*.py`
# and the Sphinx build (docs/conf.py reads this table), where a failure is a
# warning and so fails the `-W` build.  The subset keeps the structural
# guarantees that drift silently when signatures change:
#   GL06 known section names; GL08 docstring present; SS01 summary line;
#   PR01 every parameter documented; PR02 no unknown parameters documented;
#   PR03 parameters in signature order; RT01 Returns section present;
#   EX01 Examples section present (they also run as doctests).
# SA01 ("See Also" present) is off for now: 46 public functions lack one.
# The stylistic checks (GL02, RT02, PR06, SA04, ES01, ...) are off as well.
checks = ["GL06", "GL08", "SS01", "PR01", "PR02", "PR03", "RT01", "EX01"]
exclude = [
    # Patterns match both the lint's "module.name" and Sphinx's
    # "networkx_backbone.name".  Private modules and helpers, at any depth:
    '(^|\.)_',
    # Module docstrings (lint only): narrative overviews with free headings.
    '^[a-z_]+$',
    # Closures nested inside public functions (lint only).
    '^(?!networkx_backbone\.)[a-z_]+\.[a-z0-9_]+\.[a-z0-9_]+$',
    # Short aliases: thin wrappers whose docstring points at the full function.
    '(^|\.)(disparity|mlf|lans|svh|svc)$',
    # Result containers built by the library, not by users: their fields are
    # documented under "Attributes" (which PR01 does not read), and the
    # functions that return them carry the examples.
    '(^|\.)(HypergraphBackbone|ValidatedHypergraph)(\.|$)',
    # describe.py internals: registry record classes and the registry tables
    # (data, not functions; documented in the module docstring).
    '(^|\.)describe\.(Reference|Method|METHODS|ALIASES|EXCLUDED|REFERENCES|SCORE_KEYS)(\.|$)',
]
