# Build and deploy Sphinx documentation to GitHub Pages.
# Triggered when a GitHub Release is published (it builds the release tag) and
# manually (it builds and deploys the selected branch, normally main).
#
# "Re-run jobs" on a release run uses this workflow file as it was at the tag.
# That helps when the cause lies outside the file (for example the
# github-pages environment's tag rules); after a fix to this file, run the
# workflow by hand on main instead, while main is still at the release commit.

name: Deploy Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Force Node 24 for JS actions still on Node 20 (deprecation 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"
          python -m pip install matplotlib
          python -m pip install -r docs/requirements.txt

      - name: Build Sphinx documentation (generates the method gallery)
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          XDG_CACHE_HOME: /tmp/.cache
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going -n"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
