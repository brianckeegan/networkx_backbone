# Build the documentation strictly on pull requests that touch the code or the
# docs. The build regenerates the method gallery (scripts/generate_visualizations.py,
# called from docs/conf.py) from the current code and fails when a public
# method has no gallery figure, so the gallery cannot go stale. The built HTML
# is uploaded for review.

name: Docs and Method Gallery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nx_backbone/**/*.py"
      - "scripts/generate_visualizations.py"
      - "scripts/roadmap_figures.py"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/generate-visualizations.yml"

env:
  # Force Node 24 for JS actions still on Node 20 (deprecation 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs:
    name: Build docs and method gallery
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,docs]"
          python -m pip install -r docs/requirements.txt

      - name: Build docs (generates the method gallery)
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          XDG_CACHE_HOME: /tmp/.cache
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going -n"

      - name: Upload built HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
