# Test the hypergraph_io adapters against the real xgi, HyperNetX, HypergraphX,
# and HAT releases (the main test suite uses stand-in modules).
#
# This is a separate workflow so it can stay a non-required check: a breaking
# upstream release turns it red without blocking unrelated pull requests. The
# weekly run catches upstream releases between pull requests.

name: Interop

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MPLBACKEND: Agg

jobs:
  interop:
    name: Hypergraph libraries (latest releases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[interop,test]"
      - name: Library versions
        run: >
          python -m pip list 2>/dev/null
          | grep -iE "^(xgi|hypernetx|hypergraphx|HypergraphAnalysisToolbox|pandas|numpy|networkx) "
      - name: Run interop tests
        env:
          # A library that fails to import is an error here, not a skip.
          NX_BACKBONE_REQUIRE_INTEROP: "1"
        run: pytest -m interop -rs
