{% set name = "networkx-backbone" %}
{# The version comes from the release tag.  publish-to-conda.yml sets
   NETWORKX_BACKBONE_VERSION from setuptools-scm (checked against the tag on
   release), and the build passes it on to setuptools-scm so the conda package
   and the installed metadata agree. #}
{% set version = environ.get("NETWORKX_BACKBONE_VERSION", "0.0.0") %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../../..

build:
  noarch: python
  number: 0
  script: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }} {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.12
    - networkx >=3.4

test:
  imports:
    - networkx_backbone
  # The tests also read the Les Misérables benchmark definitions, the roadmap
  # figure script, two docs pages, the README and the pytest configuration.
  source_files:
    - tests/
    - benchmarks/
    - scripts/
    - docs/
    - README.md
    - pyproject.toml
  requires:
    - pytest >=7.0
    - numpy >=2.2
    - scipy >=1.15
    - pandas >=2.3
  commands:
    - python -c "import importlib.metadata as m; v = m.version('networkx-backbone'); assert v == '{{ version }}', v"
    - pytest tests/ -v

about:
  home: https://github.com/brianckeegan/networkx_backbone
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Backbone extraction algorithms for complex networks
  description: |
    networkx-backbone provides backbone extraction algorithms for complex
    networks and hypergraphs, organized into statistical, structural,
    proximity, hybrid, bipartite, hypergraph, unweighted, filtering, and
    evaluation modules.
  dev_url: https://github.com/brianckeegan/networkx_backbone

extra:
  recipe-maintainers:
    - brianckeegan
