{% set name = "nx-backbone" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../../..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.12
    - networkx >=3.0

test:
  imports:
    - nx_backbone
  source_files:
    - tests/
  requires:
    - pytest >=7.0
    - numpy >=1.23
    - scipy >=1.9
  commands:
    - pytest tests/ -v

about:
  home: https://github.com/brianckeegan/nx-backbone
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Backbone extraction algorithms for complex networks
  description: |
    nx-backbone provides 56 backbone extraction algorithms for
    complex networks, organized into statistical, structural, proximity,
    hybrid, bipartite, unweighted, filtering, and evaluation modules.
  dev_url: https://github.com/brianckeegan/nx-backbone

extra:
  recipe-maintainers:
    - brianckeegan
