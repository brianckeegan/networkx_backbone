{% set name = "nx-backbone" %}
{# The version comes from the release tag.  publish-to-conda.yml sets
   NX_BACKBONE_VERSION from setuptools-scm (checked against the tag when it
   builds one), and the build passes it on to setuptools-scm so the conda
   package and the installed metadata agree.  To build locally:
   NX_BACKBONE_VERSION=X.Y.Z conda build .github/workflows/conda-recipe/
   --override-channels -c conda-forge #}
{% set version = environ.get("NX_BACKBONE_VERSION", "0.0.0") %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../../..

build:
  noarch: python
  number: 0
  script: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }} {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.12
    - networkx >=3.4

test:
  imports:
    - nx_backbone
  # The tests also read the Les Misérables benchmark definitions, the scripts,
  # docs pages and figure scripts, the README and the pytest configuration.
  source_files:
    - tests/
    - benchmarks/
    - scripts/
    - docs/
    - README.md
    - pyproject.toml
  requires:
    - pytest >=7.0
    - numpy >=2.2
    - scipy >=1.15
    - pandas >=2.3
  commands:
    - python -c "import importlib.metadata as m; v = m.version('nx-backbone'); assert v == '{{ version }}', v"
    - pytest tests/ -v

about:
  home: https://github.com/brianckeegan/nx-backbone
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Backbone extraction algorithms for complex networks
  description: |
    nx-backbone provides backbone extraction algorithms for complex
    networks and hypergraphs, organized into statistical, structural,
    proximity, hybrid, bipartite, hypergraph, unweighted, filtering, and
    evaluation modules.
  dev_url: https://github.com/brianckeegan/nx-backbone

extra:
  recipe-maintainers:
    - brianckeegan
