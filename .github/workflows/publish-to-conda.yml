# Build and publish nx-backbone as a conda package.
#
# Triggered when a GitHub Release is published (build and upload) and
# manually (build only).  conda-forge publishing is handled separately via the
# feedstock repository; this workflow builds the package and uploads to
# anaconda.org directly.
#
# The recipe takes its version from NX_BACKBONE_VERSION, which the build
# job sets from setuptools-scm and, for a release, checks against the tag.

name: Publish to Conda

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Force Node 24 for JS actions still on Node 20 (deprecation 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build and test conda package
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || '' }}
          # setuptools-scm needs the tags and the history to find them.
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Determine the package version
        shell: bash -l {0}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install "setuptools-scm>=8"
          version="$(python -m setuptools_scm)"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${version}" != "${TAG#v}" ]; then
            echo "::error::setuptools-scm version ${version} does not match release tag ${TAG}"
            exit 1
          fi
          echo "Building conda package version ${version}"
          echo "NX_BACKBONE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install conda-build tools
        shell: bash -l {0}
        run: |
          conda install -y conda-build conda-verify anaconda-client

      - name: Lint with flake8
        shell: bash -l {0}
        run: |
          conda install -y flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 nx_backbone/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 nx_backbone/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Install package and test dependencies
        shell: bash -l {0}
        run: |
          pip install -e ".[test]"

      - name: Test with pytest
        shell: bash -l {0}
        run: pytest tests/ -v

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda build .github/workflows/conda-recipe/ --output-folder dist/conda/ --no-anaconda-upload

      - name: Upload conda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: dist/conda/

  conda-publish:
    name: Upload to anaconda.org
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge

      - name: Install anaconda-client
        shell: bash -l {0}
        run: conda install -y anaconda-client

      - name: Retrieve conda package
        uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: dist/conda/

      - name: Upload to anaconda.org
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "${ANACONDA_API_TOKEN}" ]; then
            echo "::error::The ANACONDA_TOKEN repository secret is not set"
            exit 1
          fi
          shopt -s nullglob
          packages=(dist/conda/noarch/*.tar.bz2 dist/conda/noarch/*.conda)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No conda package found in dist/conda/noarch/"
            exit 1
          fi
          anaconda upload --user brianckeegan "${packages[@]}"
