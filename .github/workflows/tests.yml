# Run the test suite, doctests, and lint on every push and pull request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force Node 24 for JS actions still on Node 20 (deprecation 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff numpydoc
      - run: ruff check networkx_backbone tests
      - run: ruff format --check networkx_backbone tests
      # Same checks as the Sphinx build ([tool.numpydoc_validation] in
      # pyproject.toml), without building the docs.
      - run: python -m numpydoc lint networkx_backbone/*.py

  typecheck:
    # Non-strict mypy over the annotated public API ([tool.mypy] in
    # pyproject.toml).  numpy, scipy and matplotlib are installed so their
    # types resolve; mypy and the NetworkX stubs are pinned in the typing extra.
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[full,viz,typing]"
      - run: mypy networkx_backbone

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]" pytest-cov matplotlib
      - name: Run tests and doctests
        run: >
          pytest --doctest-modules networkx_backbone tests
          --cov=networkx_backbone --cov-report=term-missing

  dispatch:
    # Run every call to a dispatchable function (ours and NetworkX's) through
    # NetworkX's backend-dispatch test harness with its nx_loopback backend,
    # checking that results equal the plain NetworkX results.
    name: Backend dispatch (nx_loopback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]" matplotlib
      - name: Run tests and doctests under nx_loopback
        env:
          NETWORKX_TEST_BACKEND: nx_loopback
        run: pytest --doctest-modules networkx_backbone tests

  minimal-deps:
    # The core package must import and run its pure-Python methods with only
    # NetworkX installed (numpy/scipy are optional extras).
    name: Minimal dependencies (networkx only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install oldest supported NetworkX only
        run: python -m pip install "networkx==3.4" pytest && python -m pip install --no-deps -e .
      - name: Smoke-test pure-Python methods
        run: pytest tests/test_minimal_deps.py

  oldest-deps:
    # Keep the minimum versions in pyproject.toml honest: test them exactly.
    # Floors match NetworkX's own (numpy 2.2, scipy 1.15, matplotlib 3.10).
    name: Oldest supported dependencies (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install minimum versions
        run: >
          python -m pip install "networkx==3.4" "numpy==2.2.0" "scipy==1.15.0"
          "matplotlib==3.10.0" pytest
          && python -m pip install --no-deps -e .
      - name: Run tests and doctests
        run: pytest --doctest-modules networkx_backbone tests
      - name: Run tests and doctests under nx_loopback
        env:
          NETWORKX_TEST_BACKEND: nx_loopback
        run: pytest --doctest-modules networkx_backbone tests
